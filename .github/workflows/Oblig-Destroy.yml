name: Oblig – riv ned et miljø

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Miljø som skal rives ned
        type: choice
        options: [dev, test]
        required: true
      bekreftelse:
        description: 'Skriv "riv ned <miljø>" for å bekrefte'
        type: string
        required: true
      begrunnelse:
        description: Hvorfor river du ned?
        type: string
        required: true

permissions:
  contents: read

# Samme gruppe som utrullingen – de to skal aldri gå samtidig mot samme miljø.
concurrency:
  group: oblig-${{ inputs.environment }}
  cancel-in-progress: false

env:
  MILJO: ${{ inputs.environment }}

  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_INPUT: false
  TF_IN_AUTOMATION: true

  TF_VAR_environment: ${{ inputs.environment }}
  TF_VAR_shortname: ${{ vars.OBLIG_SHORTNAME }}
  TF_VAR_project: ${{ vars.OBLIG_PROJECT }}
  TF_VAR_location: ${{ vars.OBLIG_LOCATION }}

jobs:
  bekreft:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk bekreftelsen
        env:
          BEKREFTELSE: ${{ inputs.bekreftelse }}
          BEGRUNNELSE: ${{ inputs.begrunnelse }}
        run: |
          if [ "$BEKREFTELSE" != "riv ned $MILJO" ]; then
            echo "::error::Ikke bekreftet. Forventet: riv ned $MILJO"
            exit 1
          fi
          echo "Bekreftet. Begrunnelse: $BEGRUNNELSE"

  riv-app:
    needs: bekreft
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: stacks/app

    env:
      TF_VAR_backend_resource_group_name: ${{ vars.OBLIG_BACKEND_RG }}
      TF_VAR_backend_storage_account_name: ${{ vars.OBLIG_BACKEND_SA }}
      TF_VAR_backend_container_name: ${{ vars.OBLIG_BACKEND_CONTAINER }}

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/${{ env.MILJO }}/app.tfstate"

      - name: Lag en destroy-plan
        run: terraform plan -destroy -out=tfdestroy

      - name: Utfør destroy-planen
        run: terraform apply tfdestroy

      - name: Verifiser at det er tomt
        run: terraform state list

  riv-network:
    needs: riv-app
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: stacks/network

    env:
      TF_VAR_address_space: ${{ vars.OBLIG_ADDRESS_SPACE }}
      TF_VAR_subnets: ${{ vars.OBLIG_SUBNETS }}

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/${{ env.MILJO }}/network.tfstate"

      - name: Lag en destroy-plan
        run: terraform plan -destroy -out=tfdestroy

      - name: Utfør destroy-planen
        run: terraform apply tfdestroy

      - name: Verifiser at det er tomt
        run: terraform state list