name: Oblig – rull ut network og app

on:
  push:
    branches: [main]
    paths:
      - 'stacks/**'
      - 'modules/**'
      - 'shared/**'
      - '.github/workflows/Oblig-Create.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Miljø – gjelder bare ved manuell kjøring
        type: choice
        options: [dev, test]
        default: dev

permissions:
  id-token: write
  contents: read

# To kjøringer mot samme miljø venter på hverandre.
concurrency:
  group: oblig-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  MILJO: ${{ inputs.environment || 'dev' }}

  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_INPUT: false
  TF_IN_AUTOMATION: true

  TF_VAR_environment: ${{ inputs.environment || 'dev' }}
  TF_VAR_shortname: ${{ vars.OBLIG_SHORTNAME }}
  TF_VAR_project: ${{ vars.OBLIG_PROJECT }}
  TF_VAR_location: ${{ vars.OBLIG_LOCATION }}

jobs:
  network:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: stacks/network

    env:
      TF_VAR_address_space: ${{ vars.OBLIG_ADDRESS_SPACE }}
      TF_VAR_subnets: ${{ vars.OBLIG_SUBNETS }}

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hvem er jeg (K11)
        run: az account show

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/${{ env.MILJO }}/network.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan

  app:
    needs: network
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: stacks/app

    env:
      TF_VAR_backend_resource_group_name: ${{ vars.OBLIG_BACKEND_RG }}
      TF_VAR_backend_storage_account_name: ${{ vars.OBLIG_BACKEND_SA }}
      TF_VAR_backend_container_name: ${{ vars.OBLIG_BACKEND_CONTAINER }}

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/${{ env.MILJO }}/app.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan